name: Build and Release macOS

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, for example 1.2.0. Defaults to Support/Info.plist."
        required: false
        type: string
      fork_revision:
        description: "Positive numeric fork revision for this upstream version. Defaults to StatusTrioForkRevision in Support/Info.plist."
        required: false
        type: string
      build:
        description: "Numeric CFBundleVersion. Defaults to Support/Info.plist."
        required: false
        type: string
      tag:
        description: "Release tag. Defaults to vVERSION-fork.REVISION."
        required: false
        type: string
      publish:
        description: "Create a GitHub Release with DMG and SHA-256 assets."
        required: true
        default: false
        type: boolean
      publish_appcast:
        description: "Also publish a signed Sparkle appcast using this fork’s matching key pair."
        required: true
        default: false
        type: boolean
      release_notes:
        description: "English release notes. One bullet per line. Defaults to commits since the previous tag."
        required: false
        type: string
      release_notes_zh:
        description: "Chinese release notes. One bullet per line. Required when publish=true."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: status-trio-${{ github.repository }}-${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'publication' || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RELEASE_REPO: ${{ vars.RELEASE_REPO }}
      RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH }}
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
      PUBLISH_APPCAST: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_appcast || false }}
      RELEASE_TARGET: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16.4 and verify Swift 6.1.2
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_16.4.app"
          if [[ ! -d "${XCODE_PATH}" ]]; then
            echo "::error::Xcode 16.4 is unavailable on this runner."
            exit 1
          fi
          sudo xcode-select --switch "${XCODE_PATH}/Contents/Developer"
          echo "DEVELOPER_DIR=${XCODE_PATH}/Contents/Developer" >> "${GITHUB_ENV}"
          xcodebuild -version | grep -F "Xcode 16.4"
          swift --version | grep -F "Swift version 6.1.2"

      - name: Resolve release version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          FORK_REVISION_INPUT: ${{ inputs.fork_revision }}
          BUILD_INPUT: ${{ inputs.build }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Support/Info.plist)"
          PLIST_FORK_REVISION="$(/usr/libexec/PlistBuddy -c "Print :StatusTrioForkRevision" Support/Info.plist)"
          PLIST_BUILD="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Support/Info.plist)"

          VERSION="${VERSION_INPUT:-${PLIST_VERSION}}"
          FORK_REVISION="${FORK_REVISION_INPUT:-${PLIST_FORK_REVISION}}"
          BUILD="${BUILD_INPUT:-${PLIST_BUILD}}"
          TAG="${TAG_INPUT:-v${VERSION}-fork.${FORK_REVISION}}"
          EXPECTED_TAG="v${VERSION}-fork.${FORK_REVISION}"

          if [[ ! "${VERSION}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::VERSION must contain dot-separated numbers."
            exit 1
          fi
          if [[ ! "${FORK_REVISION}" =~ ^[0-9]+$ || "${FORK_REVISION}" == "0" ]]; then
            echo "::error::FORK_REVISION must be a positive integer."
            exit 1
          fi
          if [[ ! "${BUILD}" =~ ^[0-9]+$ ]]; then
            echo "::error::BUILD must contain only digits."
            exit 1
          fi
          if [[ "${TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "::error::TAG must be ${EXPECTED_TAG}."
            exit 1
          fi
          if [[ "${VERSION}" != "${PLIST_VERSION}" || "${FORK_REVISION}" != "${PLIST_FORK_REVISION}" || "${BUILD}" != "${PLIST_BUILD}" ]]; then
            echo "::error::Workflow version inputs must match the checked-out Support/Info.plist. Update source metadata before preflight or publishing."
            exit 1
          fi
          if [[ "${PUBLISH}" == "true" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Formal publication must run from main after the preflighted commit is merged."
            exit 1
          fi

          {
            echo "VERSION=${VERSION}"
            echo "FORK_REVISION=${FORK_REVISION}"
            echo "BUILD=${BUILD}"
            echo "TAG=${TAG}"
          } >> "${GITHUB_ENV}"

          echo "Resolved release ${TAG}: upstream ${VERSION}, fork ${FORK_REVISION}, build ${BUILD}"
      - name: Validate Sparkle signing configuration
        if: ${{ env.PUBLISH_APPCAST == 'true' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_KEY}" || -z "${SPARKLE_PUBLIC_KEY}" ]]; then
            echo "::error::Set matching SPARKLE_PRIVATE_KEY secret and SPARKLE_PUBLIC_KEY repository variable before publishing Sparkle updates."
            exit 1
          fi

      - name: Configure Developer ID signing
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "${PUBLISH}" != "true" || -z "${DEVELOPER_ID_CERTIFICATE_P12}" ]]; then
            echo "Developer ID signing is not configured; using Ad-hoc signing."
            exit 0
          fi

          if [[ -z "${CERTIFICATE_PASSWORD}" ]]; then
            echo "::error::DEVELOPER_ID_CERTIFICATE_PASSWORD is required when a certificate is provided."
            exit 1
          fi

          CERT_PATH="${RUNNER_TEMP}/developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "${DEVELOPER_ID_CERTIFICATE_P12}" | base64 -D > "${CERT_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" \
            -P "${CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          rm -f "${CERT_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN_PATH}" \
            $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(
            security find-identity -v -p codesigning "${KEYCHAIN_PATH}" \
              | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' \
              | head -n 1
          )"

          if [[ -z "${IDENTITY}" ]]; then
            echo "::error::No Developer ID Application identity was found in the imported certificate."
            exit 1
          fi

          {
            echo "CODE_SIGN_IDENTITY=${IDENTITY}"
            echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}"
          } >> "${GITHUB_ENV}"

      - name: Configure Apple notarization
        env:
          NOTARY_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          NOTARY_API_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ "${PUBLISH}" != "true" || -z "${NOTARY_API_PRIVATE_KEY}" ]]; then
            echo "Apple notarization is not configured."
            exit 0
          fi

          if [[ -z "${NOTARY_API_KEY_ID}" || -z "${NOTARY_API_ISSUER_ID}" ]]; then
            echo "::error::App Store Connect API key ID and issuer ID are required for notarization."
            exit 1
          fi

          KEY_PATH="${RUNNER_TEMP}/AuthKey_${NOTARY_API_KEY_ID}.p8"
          printf '%s' "${NOTARY_API_PRIVATE_KEY}" > "${KEY_PATH}"

          xcrun notarytool store-credentials "status-trio-notary" \
            --key "${KEY_PATH}" \
            --key-id "${NOTARY_API_KEY_ID}" \
            --issuer "${NOTARY_API_ISSUER_ID}"
          rm -f "${KEY_PATH}"

          echo "NOTARY_PROFILE=status-trio-notary" >> "${GITHUB_ENV}"

      - name: Prepare release notes
        if: ${{ env.PUBLISH == 'true' }}
        env:
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
          RELEASE_NOTES_ZH_INPUT: ${{ inputs.release_notes_zh }}
        run: |
          set -euo pipefail
          NOTES_PATH="${RUNNER_TEMP}/release-notes.md"
          APPCAST_NOTES_PATH="${RUNNER_TEMP}/appcast-release-notes.md"
          RELEASE_BODY_PATH="${RUNNER_TEMP}/github-release-notes.md"

          if [[ -z "${RELEASE_NOTES_ZH_INPUT//[[:space:]]/}" ]]; then
            echo "::error::release_notes_zh is required when publish=true."
            exit 1
          fi

          if [[ -n "${RELEASE_NOTES_INPUT}" ]]; then
            printf '%s\n' "${RELEASE_NOTES_INPUT}" > "${NOTES_PATH}"
          else
            PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            if [[ -n "${PREVIOUS_TAG}" ]] && git rev-parse "${PREVIOUS_TAG}" >/dev/null 2>&1; then
              git log --pretty=format:'- %s' "${PREVIOUS_TAG}..HEAD" > "${NOTES_PATH}"
            else
              git log --pretty=format:'- %s' -20 > "${NOTES_PATH}"
            fi
            printf '\n' >> "${NOTES_PATH}"
          fi

          {
            printf '# Version %s （English + 中文， 中文在下方）\n\n' "${VERSION}"
            printf "Upstream version: %s · Fork revision: %s · Build: %s\n\n" "${VERSION}" "${FORK_REVISION}" "${BUILD}"
            printf '## English\n\n'
            cat "${NOTES_PATH}"
            printf '\n## 中文\n\n'
            printf '%s\n' "${RELEASE_NOTES_ZH_INPUT}"
          } > "${APPCAST_NOTES_PATH}"

          cp "${APPCAST_NOTES_PATH}" "${RELEASE_BODY_PATH}"
          {
            printf '\n## First launch / 首次启动\n\n'
            printf 'If macOS blocks the first launch, run:\n\n'
            printf '```bash\n'
            printf 'xattr -dr com.apple.quarantine "/Applications/Status Trio.app"\n'
            printf 'open "/Applications/Status Trio.app"\n'
            printf '```\n\n'
            printf '如果 macOS 阻止首次启动，请运行：\n\n'
            printf '```bash\n'
            printf 'xattr -dr com.apple.quarantine "/Applications/Status Trio.app"\n'
            printf 'open "/Applications/Status Trio.app"\n'
            printf '```\n'
          } >> "${RELEASE_BODY_PATH}"

          {
            echo "RELEASE_NOTES_FILE=${NOTES_PATH}"
            echo "APPCAST_RELEASE_NOTES_FILE=${APPCAST_NOTES_PATH}"
            echo "RELEASE_BODY_FILE=${RELEASE_BODY_PATH}"
          } >> "${GITHUB_ENV}"

      - name: Run tests
        run: |
          set +e
          swift test
          TEST_EXIT_CODE=$?
          set -e

          if [[ "${TEST_EXIT_CODE}" -ne 0 ]]; then
            echo "SwiftPM resource bundle diagnostics:"
            find .build -name 'StatusTrio_StatusTrioCore.bundle' -type d -print
            find .build -name 'StatusTrio_StatusTrioCore.bundle' -type d -exec find {} -maxdepth 4 -print \;
            find .build -name 'Localizable.strings' -print | head -n 50
          fi

          exit "${TEST_EXIT_CODE}"

      - name: Build, sign, notarize, and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: bash scripts/release.sh

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StatusTrio-${{ github.run_number }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.release-metadata.json
            dist/release.env
          if-no-files-found: ignore

      - name: Clean up signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "${KEYCHAIN_PATH}" || true
